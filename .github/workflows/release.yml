name: Release

# When a GitHub release is published: checks the plugin, then attaches the desktop app's
# Windows installer, the file its updater reads (latest.yml) and its macOS zips to the
# release. Nothing goes to npm. Run by hand, it only checks and builds; run by hand with
# the tag of a published release, it attaches the files to that release, for a release whose
# publishing started no run:
#
#   gh workflow run Release --ref main -f tag=vX.Y.Z
#
# The release tag must be v<version in plugin/package.json> and must point at a commit on
# main: by hand, at the commit the run builds.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: The published release to attach the files to, as vX.Y.Z. Empty only checks and builds.
        required: false
        default: ''

env:
  # The release the files go to; empty when a run by hand only checks and builds.
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

permissions:
  # write: attach the files to the release.
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    name: Check the plugin
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: plugin
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check the tag and the branch
        if: env.TAG != ''
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::The release tag is $TAG, but plugin/package.json has version $version. Tag v$version or change the version."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$TAG points at a commit that is not on main. Release from main."
            exit 1
          fi
          # A run by hand builds the commit it runs on, which must be the one the tag names.
          if [ "$(git rev-parse "refs/tags/$TAG^{commit}")" != "$GITHUB_SHA" ]; then
            echo "::error::$TAG does not point at the commit this run builds ($GITHUB_SHA). Run the workflow on the tag's commit."
            exit 1
          fi

      - name: Check the app version
        run: |
          version="$(node -p "require('./package.json').version")"
          app="$(node -p "require('../app/package.json').version")"
          if [ "$app" != "$version" ]; then
            echo "::error::app/package.json has version $app, but plugin/package.json has $version. Give both the same version."
            exit 1
          fi

      - run: npm ci --no-fund --no-audit
        working-directory: .
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm test
      - run: node scripts/build-client.mjs --check
      - run: npm run lint

  app-windows:
    name: Desktop app installer (Windows)
    needs: check
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --no-fund --no-audit
        working-directory: .
      - run: npm run dist
      - name: Check the packaged app
        run: node scripts/check-packed.mjs
      - name: Keep the installer for real-device checks
        if: env.TAG == ''
        uses: actions/upload-artifact@v4
        with:
          name: ApmixBot-win-x64
          path: app/dist-pack/ApmixBot-*-win-x64.exe
          retention-days: 7
          if-no-files-found: error
          compression-level: 0

      - name: Attach the installer to the release
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          installer="dist-pack/ApmixBot-$(node -p "require('./package.json').version")-win-x64.exe"
          files=("$installer")
          # latest.yml is what the installed apps read to find this version; it and the blockmap
          # exist only while electron-builder.yml names a release feed.
          for extra in "$installer.blockmap" dist-pack/latest.yml; do
            if [ -f "$extra" ]; then files+=("$extra"); fi
          done
          gh release upload "$TAG" "${files[@]}" --clobber

  app-macos:
    name: Desktop app zip (macOS ${{ matrix.arch }})
    needs: check
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: arm64, runner: macos-latest }
          - { arch: x64, runner: macos-26-intel }
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --no-fund --no-audit
        working-directory: .
      - run: npm run dist
      - name: Check the packaged app
        run: node scripts/check-packed.mjs
      - name: Keep the zip for real-device checks
        if: env.TAG == ''
        uses: actions/upload-artifact@v4
        with:
          name: ApmixBot-mac-${{ matrix.arch }}
          path: app/dist-pack/ApmixBot-*-mac-${{ matrix.arch }}.zip
          retention-days: 7
          if-no-files-found: error
          compression-level: 0
      - name: Attach the zip to the release
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip="dist-pack/ApmixBot-$(node -p "require('./package.json').version")-mac-${{ matrix.arch }}.zip"
          gh release upload "$TAG" "$zip" --clobber
